name: Global Package Cleanup

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  delete-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all FFmpeg packages
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DELETE_PACKAGES_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const packages = await github.rest.packages.listPackagesForUser({
              package_type: 'container',
              username: owner
            });

            for (const pkg of packages.data) {
              // Only delete packages related to your ffmpeg build
              if (pkg.name.includes('ffmpeg-builds')) {
                console.log(`Deleting package: ${pkg.name}`);
                await github.rest.packages.deletePackageForUser({
                  package_type: 'container',
                  package_name: pkg.name,
                  username: owner
                });
              }
            }
